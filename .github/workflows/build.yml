name: Build Resource Pack

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create resource pack ZIP
        run: |
          zip -r fightclub-resourcepack.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "fightclub-resourcepack.zip" \
            -x "README.md"

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: fightclub-resourcepack
          path: fightclub-resourcepack.zip