name: Build Resource Pack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create resource pack ZIP
        run: |
          zip -r resourcepack.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "resourcepack.zip" \
            -x "README.md"

      - name: Delete previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete resourcepack-latest --yes || true
          git push --delete origin resourcepack-latest || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create resourcepack-latest \
            resourcepack.zip \
            --title "Resource Pack" \
            --notes "Latest version of the Minecraft resource pack." \
            --latest